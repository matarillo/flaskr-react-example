name: SonarQube Cloud - Frontend

on:
  workflow_dispatch:

jobs:
  sonar:
    name: Build, test and analyze on SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: |
          npm run test -- \
            --run --coverage \
            --reporter=junit --outputFile=vitest/junit-report.xml \
            --reporter=default \
            || touch vitest/testfail

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=matarillo-bitbucket_flaskr-frontend
            -Dsonar.organization=matarillo-bitbucket
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Copy test reports
        working-directory: frontend
        run: |
          mkdir -p test-reports
          cp vitest/junit-report.xml test-reports/

      - name: Upload coverage and test reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            frontend/coverage/**
            frontend/test-reports/**

      - name: Check test result
        working-directory: frontend
        run: |
          if [ -f vitest/testfail ]; then
            echo "Vitest failed."
            exit 1
          fi
